<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rain Clock</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&display=swap");

      :root {
        --color-near-black: #1c1c1e;
        --color-white: #ffffff;
        --color-blue-450: #5b76fe;
        --color-slate: #555a6a;
        --color-placeholder: #a5a8b5;
        --color-border: #c7cad5;
        --color-ring: rgb(224, 226, 232);
        --color-teal-light: #c3faf5;
        --color-coral-light: #ffc6c6;
        --color-rose-light: #ffd8f4;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family:
          "Noto Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: linear-gradient(
          135deg,
          #0d1b2e 0%,
          #112240 30%,
          #0a1628 60%,
          #071120 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        position: relative;
      }

      #rain-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .clock-card {
        position: relative;
        z-index: 10;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow:
          rgb(224, 226, 232) 0px 0px 0px 1px inset,
          0 8px 32px rgba(0, 0, 0, 0.35),
          0 2px 8px rgba(91, 118, 254, 0.15);
        padding: 56px 72px;
        text-align: center;
        min-width: 480px;
        user-select: none;
      }

      .clock-label {
        font-family: "Noto Sans", sans-serif;
        font-size: 10.5px;
        font-weight: 400;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--color-blue-450);
        font-feature-settings:
          "liga" 0,
          "ss01",
          "ss04",
          "ss05";
        margin-bottom: 20px;
        opacity: 0.9;
      }

      .clock-time {
        font-family: "Roobert PRO Medium", "Roobert PRO", Georgia, serif;
        font-size: 88px;
        font-weight: 400;
        line-height: 1.05;
        letter-spacing: -3.5px;
        color: var(--color-white);
        font-feature-settings: "blwf", "cv03", "cv04", "cv09", "cv11";
        margin-bottom: 8px;
        text-shadow: 0 2px 24px rgba(91, 118, 254, 0.25);
      }

      .clock-seconds {
        font-family: "Noto Sans", sans-serif;
        font-size: 32px;
        font-weight: 400;
        letter-spacing: -0.5px;
        color: var(--color-blue-450);
        margin-left: 6px;
        opacity: 0.85;
      }

      .clock-date {
        font-family: "Noto Sans", sans-serif;
        font-size: 18px;
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: -0.2px;
        color: rgba(255, 255, 255, 0.55);
        font-feature-settings:
          "liga" 0,
          "ss01",
          "ss04",
          "ss05";
        margin-top: 16px;
      }

      .clock-weekday {
        display: inline-block;
        margin-top: 20px;
        padding: 5px 16px;
        border-radius: 50px;
        background: rgba(91, 118, 254, 0.15);
        border: 1px solid rgba(91, 118, 254, 0.3);
        font-family: "Noto Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--color-blue-450);
      }

      .clock-divider {
        width: 48px;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--color-blue-450),
          transparent
        );
        margin: 24px auto 0;
        border-radius: 99px;
        opacity: 0.6;
      }

      .glow {
        position: fixed;
        z-index: 1;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
      }
      .glow-blue {
        width: 500px;
        height: 500px;
        background: rgba(91, 118, 254, 0.12);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
      .glow-teal {
        width: 300px;
        height: 300px;
        background: rgba(195, 250, 245, 0.06);
        top: 20%;
        left: 20%;
      }
      .glow-coral {
        width: 280px;
        height: 280px;
        background: rgba(255, 198, 198, 0.05);
        bottom: 20%;
        right: 20%;
      }
    </style>
  </head>
  <body>
    <canvas id="rain-canvas"></canvas>

    <div class="glow glow-blue"></div>
    <div class="glow glow-teal"></div>
    <div class="glow glow-coral"></div>

    <div class="clock-card">
      <div class="clock-label">Current Time</div>
      <div class="clock-time">
        <span id="hh">00</span>:<span id="mm">00</span
        ><span class="clock-seconds">:<span id="ss">00</span></span>
      </div>
      <div class="clock-date" id="date-display">2026年1月1日</div>
      <div class="clock-weekday" id="weekday-display">星期一</div>
      <div class="clock-divider"></div>
    </div>

    <script>
      const WEEKDAYS = [
        "星期日",
        "星期一",
        "星期二",
        "星期三",
        "星期四",
        "星期五",
        "星期六",
      ];

      function pad(n) {
        return String(n).padStart(2, "0");
      }

      function updateClock() {
        const now = new Date();
        document.getElementById("hh").textContent = pad(now.getHours());
        document.getElementById("mm").textContent = pad(now.getMinutes());
        document.getElementById("ss").textContent = pad(now.getSeconds());

        const y = now.getFullYear();
        const mo = now.getMonth() + 1;
        const d = now.getDate();
        document.getElementById("date-display").textContent =
          `${y}年${mo}月${d}日`;
        document.getElementById("weekday-display").textContent =
          WEEKDAYS[now.getDay()];
      }

      updateClock();
      setInterval(updateClock, 1000);

      const canvas = document.getElementById("rain-canvas");
      const ctx = canvas.getContext("2d");

      let drops = [];
      const DROP_COUNT = 160;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      function randomDrop() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          length: 12 + Math.random() * 28,
          speed: 8 + Math.random() * 14,
          opacity: 0.08 + Math.random() * 0.22,
          width: 0.5 + Math.random() * 1,
        };
      }

      function initDrops() {
        drops = [];
        for (let i = 0; i < DROP_COUNT; i++) {
          const d = randomDrop();
          d.y = Math.random() * canvas.height; // scatter on start
          drops.push(d);
        }
      }

      function drawRain() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const d of drops) {
          const grad = ctx.createLinearGradient(d.x, d.y, d.x, d.y + d.length);
          grad.addColorStop(0, `rgba(180, 210, 255, 0)`);
          grad.addColorStop(0.4, `rgba(195, 225, 255, ${d.opacity})`);
          grad.addColorStop(1, `rgba(91, 118, 254, ${d.opacity * 0.6})`);

          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - 0.5, d.y + d.length);
          ctx.strokeStyle = grad;
          ctx.lineWidth = d.width;
          ctx.lineCap = "round";
          ctx.stroke();

          d.y += d.speed;
          if (d.y - d.length > canvas.height) {
            Object.assign(d, randomDrop());
          }
        }

        requestAnimationFrame(drawRain);
      }

      resize();
      initDrops();
      drawRain();

      window.addEventListener("resize", () => {
        resize();
        initDrops();
      });
    </script>
  </body>
</html>
