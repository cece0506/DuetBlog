<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>波点图案生成器 - Duet</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body>
    <div class="site-shell dot-tool-shell">
      <nav class="top-nav">
        <a class="brand" href="/">DUET<small>visual notes</small></a>
        <div class="nav-links">
          <a data-nav-link href="/">首页</a>
          <a data-nav-link href="/pages/blog.html">博客</a>
          <div class="tools-nav-group">
            <a data-nav-link href="/pages/tools.html">工具</a>
            <div class="tools-nav-menu" data-tools-menu></div>
          </div>
        </div>
      </nav>

      <aside class="side-nav" aria-label="侧边导航">
        <a data-nav-link href="/">首页</a>
        <a data-nav-link href="/pages/blog.html">博客</a>
        <a data-nav-link href="/pages/tools.html">工具</a>
        <button type="button" class="side-nav-top" data-scroll-top aria-label="回到顶部">顶部</button>
      </aside>

      <main class="dot-tool-page">
        <section class="dot-tool-hero editorial-card soft-white">
          <div>
            <span class="kicker">Pattern Utility</span>
            <h1 class="section-title">波点图案生成器</h1>
            <p class="hero-intro">
              按纸张尺寸、DPI 与波点参数实时生成可下载 PNG，默认采用梅花桩式错位排列，方便打印手账内页、练字纸或排版底纹。
            </p>
          </div>
          <div class="dot-tool-badges" aria-label="工具特性">
            <span>梅花桩排列</span>
            <span>厘米尺寸控制</span>
            <span>96 / 300 DPI</span>
          </div>
        </section>

        <section class="dot-tool-layout">
          <aside class="dot-control-panel editorial-card cream-panel" aria-label="波点生成控制面板">
            <div class="dot-panel-head">
              <p class="panel-kicker">Controls</p>
              <h2>纸张与样式</h2>
            </div>

            <div class="dot-form-grid">
              <label class="dot-field">
                <span>纸张尺寸预设</span>
                <select id="paper-preset">
                  <option value="A5" selected>A5（14.4 x 21.0 cm）</option>
                  <option value="A5s">A5s（11.0 x 21.0 cm）</option>
                  <option value="A6 Personal">A6 Personal（9.5 x 17.0 cm）</option>
                  <option value="A6 fc">A6 fc（10.8 x 17.0 cm）</option>
                  <option value="A6 pw">A6 pw（12.0 x 17.0 cm）</option>
                  <option value="A6 奇葩">A6 奇葩（10.5 x 14.8 cm）</option>
                  <option value="A6方方子">A6方方子（15.0 x 17.0 cm）</option>
                  <option value="A7">A7（8.0 x 12.0 cm）</option>
                  <option value="A7大纸">A7大纸（8.5 x 12.7 cm）</option>
                  <option value="M5">M5（6.2 x 10.5 cm）</option>
                  <option value="A8">A8（6.7 x 10.5 cm）</option>
                  <option value="A9">A9（6.0 x 7.8 cm）</option>
                  <option value="custom">自定义</option>
                </select>
              </label>

              <div class="dot-field-row dot-field-row-2">
                <label class="dot-field">
                  <span>画布宽度 (CM)</span>
                  <input id="paper-width" type="number" min="3" max="60" step="0.1" value="14.4" />
                </label>
                <label class="dot-field">
                  <span>画布高度 (CM)</span>
                  <input id="paper-height" type="number" min="3" max="60" step="0.1" value="21" />
                </label>
              </div>

              <div class="dot-field-row dot-field-row-2">
                <label class="dot-field">
                  <span>页边距 (MM)</span>
                  <input id="page-margin-mm" type="number" min="0" max="50" step="0.5" value="0" />
                </label>
                <label class="dot-field">
                  <span>安全出血线 (MM)</span>
                  <input id="bleed-mm" type="number" min="0" max="20" step="0.5" value="3" />
                </label>
              </div>

              <label class="dot-field">
                <span>图案重叠方式</span>
                <select id="overlap-mode">
                  <option value="cover" selected>覆盖</option>
                  <option value="multiply">融合-正片叠底</option>
                  <option value="screen">融合-滤色</option>
                  <option value="overlay">融合-叠加</option>
                  <option value="soft-light">融合-柔光</option>
                </select>
              </label>

              <div class="dot-field-row dot-field-row-2">
                <label class="dot-field">
                  <span>背景颜色</span>
                  <div class="dot-inline-color-control">
                    <input id="background-color" type="color" value="#ec94b6" />
                    <button type="button" class="dot-icon-btn" id="random-bg-color" title="随机背景颜色" aria-label="随机背景颜色">↻</button>
                  </div>
                </label>
                <div class="dot-import-export-block">
                  <span>设置</span>
                  <div class="dot-color-actions">
                    <button type="button" class="dot-mini-btn" id="export-settings">导出设置</button>
                    <button type="button" class="dot-mini-btn" id="import-settings">导入设置</button>
                  </div>
                  <input id="import-settings-file" type="file" accept="application/json" hidden />
                </div>
              </div>

              <section class="dot-layer-manager" aria-label="图层管理">
                <div class="dot-layer-tools">
                  <strong>图层配置</strong>
                  <div class="dot-color-actions">
                    <button type="button" class="dot-icon-btn" id="add-layer" title="新建图层" aria-label="新建图层">＋</button>
                  </div>
                </div>
                <div id="layer-control-list" class="dot-layer-list"></div>
              </section>

              <label class="dot-field">
                <span>DPI</span>
                <select id="paper-dpi">
                  <option value="300" selected>300 DPI</option>
                  <option value="96">96 DPI</option>
                </select>
              </label>
            </div>

            <div class="dot-panel-actions">
              <button type="button" class="btn btn-primary" id="download-pattern">下载图片</button>
            </div>

            <dl class="dot-meta-grid" aria-label="当前导出参数">
              <div>
                <dt>像素尺寸</dt>
                <dd id="pixel-size">2480 x 3508 px</dd>
              </div>
              <div>
                <dt>排列方式</dt>
                <dd id="pattern-layout">梅花桩式波点网格</dd>
              </div>
              <div>
                <dt>输出格式</dt>
                <dd>PNG</dd>
              </div>
            </dl>
          </aside>

          <section class="dot-preview-panel editorial-card mint-layers" aria-label="波点画布预览区域">
            <div class="dot-preview-head">
              <div>
                <p class="panel-kicker">Preview</p>
                <h2>预览与缩放</h2>
              </div>
              <div class="dot-zoom-controls" aria-label="缩放控制">
                <button type="button" class="dot-zoom-btn" id="zoom-out" title="缩小预览">-</button>
                <label class="dot-zoom-readout" for="preview-zoom">
                  <span>缩放</span>
                  <strong id="zoom-label">100%</strong>
                </label>
                <input id="preview-zoom" type="range" min="0.35" max="2.5" step="0.05" value="1" />
                <button type="button" class="dot-zoom-btn" id="zoom-in" title="放大预览">+</button>
              </div>
            </div>

            <div class="dot-ruler-row" aria-label="标尺选项">
              <label class="dot-check-field">
                <input id="show-ruler" type="checkbox" />
                <span>显示预览标尺（1cm 虚线网格）</span>
              </label>
              <label class="dot-check-field dot-ruler-inline-color">
                <span>标尺颜色</span>
                <input id="ruler-color" type="color" value="#7a3657" />
              </label>
            </div>

            <div class="dot-preview-layer-tools" aria-label="图层顺序调整">
              <div class="dot-layer-selector" id="preview-layer-selector" aria-label="当前拖动图层"></div>
              <div class="dot-layer-order-actions">
                <button type="button" class="dot-icon-btn" id="move-layer-up" title="上移当前图层" aria-label="上移当前图层">↑</button>
                <button type="button" class="dot-icon-btn" id="move-layer-down" title="下移当前图层" aria-label="下移当前图层">↓</button>
              </div>
            </div>

            <div class="dot-preview-scroll" id="preview-scroll">
              <div class="dot-preview-stage" id="preview-stage">
                <canvas id="dot-pattern-canvas" aria-label="波点图案预览画布"></canvas>
                <canvas id="dot-ruler-overlay" aria-hidden="true"></canvas>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script type="module" src="/assets/js/polka-dot-generator.js"></script>
  </body>
</html>
