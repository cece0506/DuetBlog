name: Cloudflare Notion Deploy

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 00:00/12:00 UTC == 北京时间 08:00/20:00
    - cron: "0 0,12 * * *"

jobs:
  trigger-cloudflare-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages Deploy Hook
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$CF_PAGES_DEPLOY_HOOK" ]; then
            echo "CF_PAGES_DEPLOY_HOOK is not set in repository secrets"
            exit 1
          fi

          curl -X POST "$CF_PAGES_DEPLOY_HOOK"
          echo "Cloudflare deploy hook triggered"

      - name: Notify Deploy Failure
        if: failure()
        env:
          DEPLOY_NOTIFY_WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}
        run: |
          if [ -z "$DEPLOY_NOTIFY_WEBHOOK" ]; then
            echo "DEPLOY_NOTIFY_WEBHOOK is not set; skip notification"
            exit 0
          fi

          curl -X POST "$DEPLOY_NOTIFY_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{"text":"Cloudflare 自动部署触发失败，请检查 GitHub Actions 日志。"}'
